font_size 16.0
font_family JetBrains Mono NerdFont

cursor_blink_interval 0
confirm_os_window_close 2

map ctrl+1 send_text all \x1b h1gt
map ctrl+2 send_text all \x1b h2gt
map ctrl+3 send_text all \x1b h3gt
map ctrl+4 send_text all \x1b h4gt
map ctrl+5 send_text all \x1b h5gt
map ctrl+6 send_text all \x1b h6gt
map ctrl+7 send_text all \x1b h7gt
map ctrl+8 send_text all \x1b h8gt
map ctrl+9 send_text all \x1b h9gt

enable_audio_bell no
sync_to_monitor yes

# BEGIN_KITTY_THEME
# Catppuccin-Latte
include current-theme.conf
# END_KITTY_THEME
