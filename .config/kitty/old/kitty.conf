# Needed for cursor  settings to work
shell_integration 	        no-cursor

# Font settings
font_family 		            JetBrainsMono Nerd Font Mono
bold_font 		              auto
italic_font 		            auto
bold_italic_font 	          auto
font_size 		              15

# General functionality
modify_font		              cell_height 105%
scrollback_lines 	          2000
enable_audio_bell 	        no

# Cursor settings
cursor_shape 		            beam
cursor_blink_interval 	    -1
cursor_stop_blinking_after  -1

# Custom keybindings
map 			                  ctrl+t new_tab
map 			                  ctrl+w close_tab
map                         alt+1 goto_tab 1
map                         alt+2 goto_tab 2
map                         alt+3 goto_tab 3
map                         alt+4 goto_tab 4
map                         alt+5 goto_tab 5
map                         alt+6 goto_tab 6
map                         alt+7 goto_tab 7
map                         alt+8 goto_tab 8
map                         alt+9 goto_tab 9
map                         alt+0 goto_tab 10
map                         ctrl+shift+right move_tab_forward
map                         ctrl+shift+left move_tab_backward

map                         alt+enter launch --type=tab --cwd=current
map                         alt+shift+enter launch --type=tab --cwd=current nvim

#map                         alt+q close_window
#map                         alt+j next_window
#map                         alt+k previous_window
#map                         alt+k previous_window
#map                         alt+l next_layout
map                         alt+left resize_window wider
map                         alt+right resize_window narrower
map                         alt+up resize_window taller
map                         alt+down resize_window shorter

# Tab bar settings
tab_bar_edge 		            top
tab_bar_min_tabs 	          1
tab_bar_style 		          separator
tab_separator               ""
# tab_powerline_style 	      slanted
tab_bar_margin_width 	      0.0
tab_bar_align 		          left
tab_switch_strategy 	      previous

# Tab display settings
tab_title_template 	        " [{index}] {title} "
active_tab_font_style       bold
inactive_tab_font_style     regular

# Window settings
enabled_layouts 	          Vertical, Tall
draw_minimal_borders 	      yes
window_margin_width 	      0
window_padding_width 	      0
hide_window_decorations     yes

# Url display settings
url_style 		              curly

# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME
